<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island Snow</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Menubar -->
  <nav class="navbar bg-light">

    <div class="container">

      <!-- Icons on the left-hand side -->
      <ul class="nav">
        <li class="nav-item p-1">
          <i class="bi bi-facebook"></i>
        </li>

        <li class="nav-item p-1">
          <i class="bi bi-twitter"></i>
        </li>

        <li class="nav-item p-1">
          <i class="bi bi-pinterest"></i>
        </li>

        <li class="nav-item p-1">
          <i class="bi bi-instagram"></i>
        </li>
      </ul>

      <!-- Icons on the right-hand side -->
      <ul class="nav justify-content-end">

        <li class="nav-item p-1">
          <i class="bi bi-envelope-fill"></i>
        </li>

        <li class="nav-item p-1">
          <i class="bi bi-search"></i>
        </li>

        <li class="nav-item p-1">
          <i class="bi bi-person-fill"></i>
        </li>

        <!-- My Cart Dropdown -->
        <li class="nav-item dropdown p-1">

          <a class="nav-link dropdown-toggle p-0 text-dark"
             href="#"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false">

            <i class="bi bi-cart-fill"></i>

          </a>

          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="#">My Cart</a>
            </li>
          </ul>

        </li>

      </ul>

    </div>

  </nav>


  <!-- Island Snow Logo -->
  <div class="row">

    <div class="col">

      <img src="islandsnow-logo.png"
           class="img-fluid rounded mx-auto d-block py-1"
           alt="Island Snow Logo">

    </div>

    </div>


  <!-- Second Menu -->
  <div class="container">

    <div class="row justify-content-center pt-4">

      <div class="col text-center">
        MEN <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col text-center">
        WOMEN <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col text-center">
        KIDS <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col text-center">
        BRANDS <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col text-center">
        SEARCH
      </div>

      </div>

      </div>


  <!-- Bridge Photo -->
  <div class="row justify-content-center">

    <div class="col">

      <img src="islandsnow-bridge.png"
           class="img-fluid w-100"
           alt="Island Snow Model">

    </div>

  </div>


  <!-- Footer -->
  <footer>

    <div class="container">

      <div class="row">

        <!-- Navigation -->
        <div class="col">

          <h5>NAVIGATION</h5>
          <hr>

          <p>About Us</p>
          <p>Employment</p>
          <p>Videos</p>

        </div>


        <!-- Main Menu -->
        <div class="col">

          <h5>MAIN MENU</h5>
          <hr>

          <p>Men</p>
          <p>Women</p>
          <p>Kids</p>

          </div>


        <!-- Connect -->
        <div class="col">

          <h5>CONNECT</h5>
          <hr>

          <p>Sign up for the latest updates</p>

          <input type="text" placeholder="Enter Email">

          <button class="btn btn-dark">
            Join
          </button>

        </div>

        </div>

        </div>

        </footer>


  <!-- Bootstrap 5 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
